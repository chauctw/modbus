<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>KEPServerEX Tag Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>KEPServerEX Tag Manager</h1>
    <div class="topbar-actions">
      <label class="btn">
        Import JSON
        <input type="file" id="importFile" accept=".json" hidden />
      </label>
      <button class="btn" id="exportBtn">Export JSON</button>
      <button class="btn btn-danger" id="resetBtn">Reset</button>
    </div>
  </header>

  <section id="dashboard" class="dashboard"></section>

  <main class="layout">
    <aside class="sidebar">
      <input type="text" id="treeSearch" placeholder="Tìm channel / device..." />
      <div id="tree" class="tree"></div>
      <button class="btn btn-block" id="addChannelBtn">+ Channel</button>
    </aside>

    <section class="content">
      <div id="deviceHeader" class="device-header" style="display:none">
        <div>
          <h2 id="deviceTitle"></h2>
          <div id="deviceMeta" class="muted"></div>
        </div>
        <div class="device-actions">
          <button class="btn" id="editDeviceBtn">Sửa Device</button>
          <button class="btn" id="duplicateDeviceBtn">Duplicate Device</button>
          <button class="btn btn-danger" id="deleteDeviceBtn">Xoá Device</button>
        </div>
      </div>

      <div id="tagToolbar" class="tag-toolbar" style="display:none">
        <input type="text" id="tagSearch" placeholder="Tìm tag theo tên / địa chỉ..." />
        <button class="btn" id="addTagBtn">+ Tag</button>
        <button class="btn" id="bulkAddBtn">+ Nhiều tag (CSV)</button>
        <button class="btn" id="bulkDeleteBtn" disabled>Xoá đã chọn</button>
        <button class="btn" id="bulkScanRateBtn" disabled>Sửa Scan Rate hàng loạt</button>
        <button class="btn" id="filterOnBtn">Chỉ tag ON</button>
        <span id="realtimeStatus" class="muted"></span>
        <span id="tagCountLabel" class="muted"></span>
      </div>

      <div id="tagTableWrap" class="table-wrap">
        <table id="tagTable" style="display:none">
          <thead>
          <tr>
            <th><input type="checkbox" id="selectAllTags" /></th>
            <th>STT</th>
            <th data-sort="name">Tên tag</th>
            <th data-sort="address">Address</th>
            <th data-sort="data_type">Data Type</th>
            <th data-sort="rw_access">R/W</th>
            <th data-sort="scan_rate_ms">Scan (ms)</th>
            <th>Scaling</th>
            <th>Realtime</th>
            <th>Giá trị Realtime</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="tagTableBody"></tbody>
        </table>
      </div>
      <div id="tagPagination" class="pagination"></div>

      <div id="emptyState" class="empty-state">
        <p>Chọn 1 device ở cây bên trái, hoặc bấm <b>Import JSON</b> để bắt đầu.</p>
      </div>
    </section>
  </main>

  <div id="modalRoot"></div>

  <script src="/app.js"></script>
</body>
</html>
